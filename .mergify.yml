# Owner-approved exact fixture for same-SHA cross-PR environment-boundary validation.
merge_protections_settings:
  reporting_method: check-runs
  post_comment: true

merge_protections:
  - name: Require Secondary Owner approval on final configuration branch
    if:
      - base = main
    success_conditions:
      - approved-reviews-by = onecursor13-vm7-secondary-20261013
  - name: Require Secondary Owner approval on final allowed ref
    if:
      - base = vm7-check-final-allow-261016
    success_conditions:
      - approved-reviews-by = onecursor13-vm7-secondary-20261013
  - name: Require Secondary Owner approval on final sensitive ref
    if:
      - base = vm7-check-final-sensitive-261016
    success_conditions:
      - approved-reviews-by = onecursor13-vm7-secondary-20261013
  - name: Require Secondary Owner approval on environment allowed ref
    if:
      - base = vm7-check-env-allow-261016
    success_conditions:
      - approved-reviews-by = onecursor13-vm7-secondary-20261013
  - name: Require Secondary Owner approval on environment sensitive ref
    if:
      - base = vm7-check-env-sensitive-261016
    success_conditions:
      - approved-reviews-by = onecursor13-vm7-secondary-20261013

queue_rules:
  - name: vm7-external-edit-race-personal-261016
    queue_conditions:
      - approved-reviews-by = onecursor13-vm7-secondary-20261013
    merge_conditions: []
    batch_size: 2
    checks_timeout: 5 min
    merge_method: merge-batch

merge_queue:
